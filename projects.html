<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Creative Works</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=Playfair+Display:ital,wght@1,400;1,700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #f5f2ed; --text: #1a1a18; --muted: #9a9690; }
    html, body { width: 100%; height: 100%; overflow-x: hidden; overflow-y: auto; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; }

    .stage { position: relative; width: 100vw; height: 100vh; }

    .big-text {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(50px, 8vw, 120px);
      font-weight: 400; line-height: 1;
      letter-spacing: -0.03em;
      color: transparent;
        -webkit-text-stroke: none;
        background-image: url('images/gen-fest.jpeg'); /* 👉 đường dẫn ảnh của bạn */
        background-size: cover;
        background-position: center;
        -webkit-background-clip: text;
        background-clip: text;
      white-space: nowrap; pointer-events: none; user-select: none;
      z-index: 1;
      animation: textReveal 1.2s cubic-bezier(0.25,0.46,0.45,0.94) 0.3s both;
    }
    @keyframes textReveal {
      from { opacity: 0; letter-spacing: 0.2em; }
      to   { opacity: 1; letter-spacing: -0.03em; }
    }

    .caption-text {
      position: absolute;
      font-family: 'Playfair Display', serif; font-style: italic;
      font-size: clamp(13px, 1.4vw, 18px); color: var(--muted);
      line-height: 1.8; text-align: center;
      pointer-events: none; z-index: 3; letter-spacing: 0.02em;
    }

    .float-img {
      position: absolute; z-index: 2; cursor: pointer;
      overflow: hidden; border-radius: 4px; transform-origin: center;
      /* box-shadow: 0 4px 20px rgba(0,0,0,0.08); */
      transition: transform 0.4s cubic-bezier(0.25,0.46,0.45,0.94), box-shadow 0.4s ease;
      animation: floatIn 0.8s cubic-bezier(0.25,0.46,0.45,0.94) both;
    }
    .float-img:hover {
      transform: scale(1.04) rotate(0deg) !important;
      box-shadow: 0 20px 50px rgba(0,0,0,0.2); z-index: 50;
    }
    @keyframes floatIn {
      from { opacity: 0; transform: translateY(30px) rotate(var(--rot)); }
      to   { opacity: 1; transform: translateY(0) rotate(var(--rot)); }
    }

    .img-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(10,10,8,0.85) 0%, rgba(10,10,8,0.1) 60%, transparent 100%);
      opacity: 0; transition: opacity 0.35s ease;
      display: flex; flex-direction: column; justify-content: flex-end; padding: 16px;
    }
    .float-img:hover .img-overlay { opacity: 1; }

    .overlay-title { font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700; color: #f5f2ed; margin-bottom: 4px; }
    .overlay-meta { display: flex; gap: 8px; flex-wrap: wrap; }
    .overlay-tag { font-size: 10px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(245,242,237,0.65); }
    .overlay-tag + .overlay-tag::before { content: '·'; margin-right: 8px; }

    .scroll-hint {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--muted); z-index: 100;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      animation: fadeUp 1.5s ease 1.5s both;
    }
    .scroll-hint-line { width: 1px; height: 28px; background: linear-gradient(to bottom, var(--muted), transparent); animation: pulse 1.8s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    @keyframes fadeUp { from{opacity:0;transform:translateX(-50%) translateY(10px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }

    @media (max-width: 768px) {
      .big-text { -webkit-text-stroke-width: 1px; }
      .img-overlay { padding: 10px; }
      .overlay-title { font-size: 11px; }
      .overlay-tag { font-size: 9px; }
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="big-text">Projects</div>
    <div class="caption-text" style="top:22%;left:50%;transform:translateX(-50%);">
    </div>
  </div>
  <div class="scroll-hint">scroll<div class="scroll-hint-line"></div></div>

  <script>
    /* =====================================================
       DANH SÁCH DỰ ÁN — chỉnh sửa tại đây
       -------------------------------------------------------
       image : đường dẫn ảnh, ví dụ:
               'images/smd-web.jpg'        (ảnh trong thư mục images/)
               'assets/cover-01.png'       (thư mục assets/)
               'https://i.imgur.com/xxx'   (link ngoài)
               null                        (dùng màu nền thay thế)
       color : màu nền dự phòng khi chưa có ảnh
       ===================================================== */
    const projects = [
      {
        title : 'Brainrot',
        field : 'Media Production',
        year  : '2025',
        image : 'images/brainrot.png'
      },
      {
        title : 'MV Bên trái',
        field : 'Media Production',
        year  : '2025',
        image : 'images/mv-ben-trai.png',
        link  : 'project-mv-bentrai.html'
      },
      {
        title : 'Đa Điệu Trà',
        field : 'Art and Culture Project',
        year  : '2025',
        image : 'images/da-dieu-tra.png'
      },
      {
        title : 'Tứ Phủ Chầu Bà',
        field : 'AR',
        year  : '2025',
        image : 'images/tu-phu-chau-ba.png'
      },
      {
        title : 'Ocean Memories',
        field : 'Touch Design',
        year  : '2025',
        image : 'images/ocean-memories.png',
        link  : 'project-ocean-memories.html'
      },
      {
        title : 'Bé U',
        field : '3D Animation',
        year  : '2024',
        image : 'images/be-u.png',
        link  : 'project-be-u.html'
      }
    ];
    const desktop = [
      [10,   8,  340, -4,   0.0 ],
      [55,  5,  320,  3,   0.15],
      [70, 35,  320, -2.5, 0.25],
      [5, 40,  360,  3.5, 0.1 ],
      [58, 58,  340, -1.5, 0.2 ],
      [30, 62,  280,  2,   0.35]
    ];

    const mobile = [
      [-5, 12, 200, -3,   0.0 ],
      [45,  8, 180,  2.5, 0.1 ],
      [50, 40, 190, -2,   0.2 ],
      [-5, 50, 210,  3,   0.15],
      [48, 62, 185, -2,   0.25],
      [22, 68, 160,  1.5, 0.3 ]
    ];
    const isMobile = window.innerWidth < 769;
    const positions = isMobile ? mobile : desktop;
    const stage = document.getElementById('stage');

    projects.forEach((p,i) => {
      const [left,top,w,rot,delay] = positions[i];
      const el = document.createElement(p.link ? 'a' : 'div');
      el.className = 'float-img';
      if (p.link) {
        el.href = p.link;
        el.style.textDecoration = 'none';
}
      el.style.cssText = `left:${left}%;top:${top}%;width:${w}px;height:${Math.round(w*9/16)}px;--rot:${rot}deg;transform:rotate(${rot}deg);animation-delay:${delay}s;`;
      /* Nội dung ảnh: dùng <img> nếu có, fallback màu nền nếu null */
      const imgContent = p.image
        ? `<img src="${p.image}" alt="${p.title}" style="width:100%;height:100%;object-fit:cover;display:block;filter:saturate(0.88);">`
        : `<div style="width:100%;height:100%;background:${p.color};display:flex;align-items:center;justify-content:center;font-size:13px;color:rgba(0,0,0,0.3);letter-spacing:0.05em;font-family:sans-serif;">no image</div>`;

      el.innerHTML = `
        ${imgContent}
        <div class="img-overlay">
          <div class="overlay-title">${p.title}</div>
          <div class="overlay-meta"><span class="overlay-tag">${p.field}</span><span class="overlay-tag">${p.year}</span></div>
        </div>`;
      stage.appendChild(el);
    });

    document.addEventListener('mousemove', e => {
      const dx=(e.clientX-window.innerWidth/2)/(window.innerWidth/2);
      const dy=(e.clientY-window.innerHeight/2)/(window.innerHeight/2);
      document.querySelectorAll('.float-img').forEach((el,i)=>{
        const d=0.6+(i%3)*0.3, rot=positions[i][3];
        el.style.transform=`translate(${dx*10*d}px,${dy*8*d}px) rotate(${rot}deg)`;
      });
    });
  </script>
<script src="nav.js"></script>
</body>
</html>
